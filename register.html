<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — DataLens</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Brand Header -->
      <a href="landing.html" class="auth-brand">
        <div class="brand-icon">
          <div class="brand-bar b1"></div>
          <div class="brand-bar b2"></div>
          <div class="brand-bar b3"></div>
        </div>
        <div class="brand-text-wrap">
          <span class="brand-title">DataLens</span>
          <span class="brand-subtitle">Dataset Quality &amp; Analysis Platform</span>
        </div>
      </a>

      <!-- Authentication Card -->
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-desc">Start analyzing &amp; auditing your datasets</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="auth-alert" class="auth-alert" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="auth-alert-text"></span>
        </div>

        <!-- Registration Form -->
        <form id="register-form" class="auth-form" novalidate>
          <!-- Full Name Field -->
          <div class="form-group">
            <label for="fullName" class="form-label">Full Name</label>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input 
                type="text" 
                id="fullName" 
                name="fullName" 
                class="form-input" 
                placeholder="e.g. John Doe" 
                required 
                autocomplete="name"
              />
            </div>
          </div>

          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="name@company.com" 
                required 
                autocomplete="email"
              />
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Min. 6 characters" 
                required 
                autocomplete="new-password"
              />
              <button type="button" class="btn-toggle-pwd" id="toggle-pwd-btn" aria-label="Toggle password visibility">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                class="form-input" 
                placeholder="Re-enter your password" 
                required 
                autocomplete="new-password"
              />
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btn-register" class="btn-auth-primary">
            <span id="btn-register-text">Create Account</span>
          </button>
        </form>

        <!-- Card Footer -->
        <div class="auth-footer">
          Already have an account? <a href="login.html" class="auth-link">Sign In</a>
        </div>
      </div>

      <!-- Copyright -->
      <p class="auth-page-copy">&copy; 2024 DataLens &bull; Secure Dataset Analysis Platform</p>
    </div>
  </div>

  <!-- Auth Script -->
  <script src="js/auth.js"></script>
</body>
</html>
